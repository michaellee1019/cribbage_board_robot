; Dedicated bench probe: temporarily flash a spare ESP32-S3, then restore its
; normal firmware. The host supplies the target session over UART at runtime.
[platformio]
default_envs = pairing_probe
src_dir = .

[env:pairing_probe]
platform = espressif32@6.3.2
board = esp32-s3-devkitc-1
framework = arduino
upload_speed = 57600
monitor_speed = 115200
build_src_filter = +<pairing_probe.cpp>
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -I../../lib/scorebot/src
lib_deps =
    h2zero/NimBLE-Arduino@^2.3.4
    ArduinoJson
