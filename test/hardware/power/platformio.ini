[platformio]
default_envs = power_probe
src_dir = .

; Standalone PlayerBoardV9 / TimmonsLeePPSV2 bench firmware. No game-state writes.
[env:power_probe]
platform = espressif32@6.3.2
board = esp32-s3-devkitc-1
framework = arduino
; Match the installed bootloader/partition map; the probe uses only app0.
board_upload.flash_size = 8MB
board_build.partitions = default_8MB.csv
upload_speed = 57600
monitor_speed = 115200
build_src_filter = +<power_probe.cpp>
build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DARDUINO_USB_CDC_ON_BOOT=1
