; Explicit alternative authority; never changes the default hardware build.
; Supply BOTH environment variables with the actual Pi identity. No sample
; address here is a real or inferred Pi address. See native/README.md.
[platformio]
extra_configs = platformio.ini
default_envs = pi_players

[pi_identity]
flags =
    -DSCOREBOT_LEADER_NODE_ID=${sysenv.SCOREBOT_LEADER_NODE_ID}
    -DSCOREBOT_LEADER_BLUETOOTH_MAC=${sysenv.SCOREBOT_LEADER_BLUETOOTH_MAC}

[env:pi_players]
extends = env:controller
build_flags = ${env.build_flags} ${pi_identity.flags}

[env:pi_epaper]
extends = env:leaderboard_epaper
build_flags = ${env:leaderboard_epaper.build_flags} ${pi_identity.flags}
