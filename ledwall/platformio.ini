; Passive BLE score bridge for the LED wall.
; ledgrid imports this project through firmware/cribbage_ledwall.
[platformio]
default_envs = ledwall
src_dir = src

[env]
platform = espressif32@6.3.2
framework = arduino
monitor_speed = 115200
upload_speed = 57600
lib_deps = h2zero/NimBLE-Arduino@^2.3.4
build_unflags = -std=gnu++11
build_flags =
    -std=gnu++17
    -DCORE_DEBUG_LEVEL=1
    -I../lib/scorebot/src

; Wall receivers use the ESP32-S3 USB Serial/JTAG PHY. Serial is that port.
[env:ledwall]
board = esp32-s3-devkitc-1
; The DevKit board file selects USB-OTG. This bridge uses the same
; USB-Serial/JTAG port as the wall receivers.
build_unflags =
    ${env.build_unflags}
    -DARDUINO_USB_MODE=1
build_flags =
    ${env.build_flags}
    -DARDUINO_USB_MODE=0
    -DARDUINO_USB_CDC_ON_BOOT=1

; Same bridge firmware on a Seeed XIAO ESP32S3, whose board variant already
; routes Serial to native USB.
[env:ledwall_xiao]
board = seeed_xiao_esp32s3
