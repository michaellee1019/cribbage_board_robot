[platformio]
default_envs = controller

[env]
platform = espressif32@6.3.2
board = seeed_xiao_esp32s3
framework = arduino
monitor_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:tools/printer_wifi.py
lib_deps =
	Wire
	ArduinoJson
	h2zero/NimBLE-Arduino@^2.3.4
	adafruit/Adafruit seesaw Library@^1.7.5
	adafruit/Adafruit MCP23017 Arduino Library@^2.3.2
	sparkfun/SparkFun Qwiic Alphanumeric Display Arduino Library@^2.1.4

build_unflags = -std=gnu++11
build_flags = -std=gnu++17 -DCORE_DEBUG_LEVEL=2 -DCONFIG_BT_NIMBLE_MAX_CONNECTIONS=5 -DCONFIG_BT_NIMBLE_PINNED_TO_CORE=0
build_src_filter = +<*> -<leaderboard_epaper.cpp>

debug_tool = esp-prog
debug_init_break = tbreak setup
upload_protocol = esptool
; Reliable through multi-port USB-C hubs; 460800 can drop a board mid-write.
upload_speed = 57600
debug_speed = 2000

[env:controller]

[env:debug]
build_flags = ${env.build_flags} -DSCOREBOT_DEBUG=1

; Passive hardware-input diagnostic. It logs MCP23017 button events over USB
; without applying their normal lobby, scoring, maintenance, or turn actions.
[env:button_diag]
build_flags = ${env.build_flags} -DSCOREBOT_DEBUG=1 -DSCOREBOT_BUTTON_DIAGNOSTIC=1

; Hardware-only validation build. Production uses role-specific five-minute
; player and ten-minute leaderboard timeouts; this makes cycles testable fast.
[env:sleep_test]
build_flags = ${env.build_flags} -DSCOREBOT_DEBUG=1 -DSCOREBOT_DEEP_SLEEP_IDLE_MS=15000

[env:test_embedded]
platform = espressif32@6.3.2
board = seeed_xiao_esp32s3
framework = arduino
test_framework = unity
test_filter = test_integration_error_handler
monitor_speed = 115200
build_flags = ${env.build_flags}
lib_deps = ${env.lib_deps}

[env:leaderboard_epaper]
board = esp32-s3-devkitc-1
board_upload.maximum_size = 16777216
board_upload.flash_size = 16MB
board_build.arduino.memory_type = qio_opi
board_build.partitions = default_16MB.csv
build_flags = ${env.build_flags} -DBOARD_HAS_PSRAM
build_src_filter = -<*> +<leaderboard_epaper.cpp> +<BoardRole.cpp>
extra_scripts =
lib_deps =
	h2zero/NimBLE-Arduino@^2.3.4
	zinggjm/GxEPD2@1.6.9
